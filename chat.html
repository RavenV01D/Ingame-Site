<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<style>

body{
background:black;
color:white;
font-family:monospace;
padding:20px;
}

#messages{
height:400px;
overflow:auto;
border:1px solid #333;
padding:10px;
margin-bottom:10px;
}

input{
background:#111;
border:1px solid #333;
color:white;
padding:8px;
}

button{
background:#111;
border:1px solid #333;
color:white;
padding:8px;
cursor:pointer;
}

.system{
color:#888;
font-style:italic;
}

</style>

</head>

<body>

<h2>ISLAND RELAY</h2>

<div id="login">

username:
<input id="username">

<button onclick="connect()">
connect
</button>

</div>

<div id="chat" style="display:none">

<div class="system">
limited bandwidth • unstable connection
delay 5–10 seconds • corruption possible
</div>

<br>

<div id="messages"></div>

<input id="msg">

<button onclick="sendMsg()">
send
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabase = window.supabase.createClient(
"https://jxeznfxcltjopmskpnqz.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4ZXpuZnhjbHRqb3Btc2twbnF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzNzAyNDksImV4cCI6MjA5MDk0NjI0OX0.RdBfTCcJnK2xP3WVc99QXnLHfhyuNlG2rsTPWsBp5F4"
);

let username="";
let lastId=0;

function logSystem(text){

let div=document.createElement("div");

div.className="system";

div.textContent=text;

document.getElementById("messages").appendChild(div);

}

function connect(){

username=document.getElementById("username").value.trim();

if(username===""){

alert("enter username");

return;

}

document.getElementById("login").style.display="none";

document.getElementById("chat").style.display="block";

logSystem("connected to island relay");

loadMessages();

setInterval(loadMessages,3000);

}

function corrupt(text){

let chars=text.split("");

for(let i=0;i<chars.length;i++){

if(Math.random()<0.1){

chars[i]="#@$%&█".charAt(Math.floor(Math.random()*6));

}

}

return chars.join("");

}

function showMsg(user,text){

let div=document.createElement("div");

div.innerHTML="<b>"+user+"</b>: "+text;

document.getElementById("messages").appendChild(div);

}

async function sendMsg(){

let text=document.getElementById("msg").value;

document.getElementById("msg").value="";

logSystem("transmitting...");

let delay=5000+Math.random()*5000;

setTimeout(async()=>{

try{

await supabase.from("messages").insert({

username:username,

message:corrupt(text)

});

logSystem("packet sent");

}catch(err){

logSystem("error sending message");

console.log(err);

}

},delay);

}

async function loadMessages(){

try{

let {data,error}=await supabase

.from("messages")

.select("*")

.gt("id",lastId)

.order("id");

if(error){

logSystem("database error");

return;

}

data.forEach(m=>{

showMsg(m.username,m.message);

lastId=m.id;

});

}catch{

logSystem("connection issue");

}

}

</script>

</body>

</html>
