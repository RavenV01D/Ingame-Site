<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
background:black;
color:white;
font-family:monospace;
padding:20px;
}

#messages{
height:400px;
overflow:auto;
border:1px solid #333;
padding:10px;
margin-bottom:10px;
}

input{
background:#111;
border:1px solid #333;
color:white;
padding:8px;
}

button{
background:#111;
border:1px solid #333;
color:white;
padding:8px;
cursor:pointer;
}

.system{
color:#888;
font-style:italic;
}

</style>

</head>

<body>

<h2>ISLAND RELAY</h2>

<div id="login">

username:
<input id="username">

<button onclick="connect()">connect</button>

</div>

<div id="chat" style="display:none">

<div class="system">
unstable island signal • packet corruption possible
delay 5–10 seconds
</div>

<br>

<div id="messages"></div>

<input id="msg" placeholder="message">

<button onclick="sendMsg()">send</button>

</div>

<script>

const supabase = window.supabase.createClient(
"https://jxeznfxcltjopmskpnqz.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4ZXpuZnhjbHRqb3Btc2twbnF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzNzAyNDksImV4cCI6MjA5MDk0NjI0OX0.RdBfTCcJnK2xP3WVc99QXnLHfhyuNlG2rsTPWsBp5F4"
);

let username="";

function log(text){

let d=document.createElement("div");

d.className="system";

d.textContent=text;

messages.appendChild(d);

}

function show(user,msg){

let d=document.createElement("div");

d.innerHTML="<b>"+user+"</b>: "+msg;

messages.appendChild(d);

messages.scrollTop=messages.scrollHeight;

}

function corrupt(t){

let a=t.split("");

for(let i=0;i<a.length;i++){

if(Math.random()<0.1){

a[i]="#@$%&█".charAt(Math.floor(Math.random()*6));

}

}

return a.join("");

}

function connect(){

username=document.getElementById("username").value;

if(!username){

alert("enter username");

return;

}

login.style.display="none";

chat.style.display="block";

log("connected");

subscribe();

}

function subscribe(){

supabase

.channel("chat")

.on(

"postgres_changes",

{

event:"INSERT",

schema:"public",

table:"messages"

},

payload=>{

show(payload.new.username,payload.new.message);

}

)

.subscribe();

}

function sendMsg(){

let text=msg.value;

msg.value="";

log("transmitting...");

let delay=5000+Math.random()*5000;

setTimeout(async()=>{

await supabase.from("messages").insert({

username:username,

message:corrupt(text)

});

log("packet delivered");

},delay);

}

</script>

</body>

</html>
