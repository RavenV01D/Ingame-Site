<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Island Relay Chat</title>

<style>

body{
background:black;
color:#d0d0d0;
font-family:monospace;
margin:0;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
color:white;
text-shadow: 2px 2px red, -2px -2px blue;
}

#loginBox{
text-align:center;
margin-top:120px;
}

input{
background:#111;
border:1px solid #333;
color:white;
padding:10px;
font-family:monospace;
}

button{
background:#111;
border:1px solid #333;
color:white;
padding:10px 20px;
margin-top:10px;
cursor:pointer;
}

button:hover{
border-color:white;
}

#chatBox{
display:none;
}

#messages{
height:400px;
overflow-y:auto;
border:1px solid #222;
padding:10px;
background:#050505;
margin-bottom:10px;
}

.msg{
margin-bottom:8px;
}

.system{
color:#888;
font-style:italic;
}

.warning{
color:#ff5555;
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="container">

<h1>ISLAND NETWORK</h1>

<div id="loginBox">
<p>Enter username to connect</p>
<input id="username" placeholder="username">
<br>
<button onclick="login()">connect</button>
</div>

<div id="chatBox">

<div class="warning">
Due to limited bandwidth on the island, messages may be delayed or corrupted.
</div>

<div id="messages"></div>

<input id="msgInput" placeholder="type message..." style="width:80%;">
<button onclick="sendMessage()">send</button>

</div>

</div>

<script>

const API = "https://api.jsonbin.io/v3/b/66100ab1acd3cb34a8369f2d";

let username="";
let lastSeen=0;

function login(){

username=document.getElementById("username").value.trim();

if(username.length<2){
alert("invalid username");
return;
}

document.getElementById("loginBox").style.display="none";
document.getElementById("chatBox").style.display="block";

systemMsg("connected to island relay");

loadMessages();
setInterval(loadMessages,2000);

}

function systemMsg(text){

addMsg("SYSTEM",text,true);

}

function addMsg(user,text,isSystem=false){

let box=document.getElementById("messages");

let div=document.createElement("div");

div.className="msg";

if(isSystem){
div.className+=" system";
}

div.innerHTML="<b>"+user+":</b> "+text;

box.appendChild(div);

box.scrollTop=box.scrollHeight;

}

function corrupt(text){

let chars=text.split("");

for(let i=0;i<chars.length;i++){

if(Math.random()<0.1){

chars[i]=randomChar();

}

}

return chars.join("");

}

function randomChar(){

const set="#$%&@?█▒░ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

return set[Math.floor(Math.random()*set.length)];

}

async function sendMessage(){

let input=document.getElementById("msgInput");

let text=input.value.trim();

if(text=="") return;

input.value="";

systemMsg("transmitting... signal unstable");

let delay=5000+Math.random()*5000;

setTimeout(async ()=>{

let corrupted=corrupt(text);

await fetch(API,{
method:"PUT",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
messages:[
{
user:username,
text:corrupted,
time:Date.now()
}
]
})
});

},delay);

}

async function loadMessages(){

try{

let res=await fetch(API);

let data=await res.json();

if(!data.record) return;

let msgs=data.record.messages||[];

msgs.forEach(m=>{

if(m.time>lastSeen){

addMsg(m.user,m.text);

lastSeen=m.time;

}

});

}catch(e){

systemMsg("connection unstable");

}

}

</script>

</body>
</html>
