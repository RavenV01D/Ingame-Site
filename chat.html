<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<style>

body{
background:#000;
color:#cfcfcf;
font-family:monospace;
padding:20px;
text-shadow:0 0 2px #fff2;
}

/* flicker animation */
@keyframes flicker{
0%{opacity:1}
5%{opacity:0.8}
10%{opacity:1}
15%{opacity:0.85}
20%{opacity:1}
55%{opacity:0.9}
60%{opacity:1}
}

h2{
animation:flicker 4s infinite;
letter-spacing:2px;
}

/* broken frame look */
.frame{
border:1px solid #222;
padding:8px;
background:#050505;
box-shadow:
0 0 15px #000 inset,
0 0 3px #0f0;
position:relative;
}

/* scanlines */
.frame::after{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;

background:
repeating-linear-gradient(
0deg,
rgba(255,255,255,0.03),
rgba(255,255,255,0.03) 1px,
transparent 1px,
transparent 3px
);

mix-blend-mode:overlay;
}

/* glitch text */
.glitch{
color:#9f9;
position:relative;
display:inline-block;
}

.glitch::before,
.glitch::after{
content:attr(data-text);
position:absolute;
left:0;
width:100%;
overflow:hidden;
}

.glitch::before{
color:#0ff;
z-index:-1;
animation:glitch1 2s infinite;
}

.glitch::after{
color:#f0f;
z-index:-2;
animation:glitch2 3s infinite;
}

@keyframes glitch1{
0%{clip-path:inset(0 0 90% 0)}
20%{clip-path:inset(10% 0 60% 0)}
40%{clip-path:inset(40% 0 40% 0)}
60%{clip-path:inset(80% 0 5% 0)}
80%{clip-path:inset(10% 0 70% 0)}
100%{clip-path:inset(0 0 90% 0)}
}

@keyframes glitch2{
0%{clip-path:inset(80% 0 5% 0)}
20%{clip-path:inset(40% 0 40% 0)}
40%{clip-path:inset(10% 0 70% 0)}
60%{clip-path:inset(60% 0 20% 0)}
80%{clip-path:inset(30% 0 50% 0)}
100%{clip-path:inset(80% 0 5% 0)}
}

/* warning text */
.system{
color:#666;
font-size:13px;
margin-bottom:10px;
animation:flicker 6s infinite;
}

/* iframe distortion */
iframe{
filter:
contrast(1.1)
brightness(0.9)
grayscale(0.2);

animation:shift 8s infinite;
}

@keyframes shift{
0%{transform:translate(0,0)}
50%{transform:translate(0.5px,-0.5px)}
100%{transform:translate(0,0)}
}

</style>

</head>

<body>

<h2 class="glitch" data-text="ISLAND RELAY">
ISLAND RELAY
</h2>

<div class="system">

[ attempting connection... ]<br>
[ weak signal detected ]<br>
[ packet loss 18% ]<br>
[ transmission unstable ]<br>
[ relay station status: abandoned ]<br>

</div>

<div class="frame">

<iframe src="https://www5.cbox.ws/box/?boxid=962296&boxtag=0T77g9" width="200" height="900" allowtransparency="yes" allow="autoplay" frameborder="0" marginheight="0" marginwidth="0" scrolling="auto"></iframe>	

</div>

</body>

</html>
