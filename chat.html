<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
background:black;
color:white;
font-family:monospace;
padding:20px;
}

#messages{
height:400px;
overflow:auto;
border:1px solid #333;
padding:10px;
margin-bottom:10px;
}

input{
background:#111;
border:1px solid #333;
color:white;
padding:8px;
}

button{
background:#111;
border:1px solid #333;
color:white;
padding:8px;
cursor:pointer;
}

.system{
color:#888;
font-style:italic;
}

</style>

</head>

<body>

<h2>ISLAND RELAY</h2>

<div id="login">

username:
<input id="username">

<button onclick="connect()">
connect
</button>

</div>

<div id="chat" style="display:none">

<div class="system">
limited bandwidth • packet loss detected
messages may corrupt • delay 5–10 seconds
</div>

<br>

<div id="messages"></div>

<input id="msg" placeholder="message">

<button onclick="sendMsg()">
send
</button>

</div>

<script>

const supabase = window.supabase.createClient(

"https://jxeznfxcltjopmskpnqz.supabase.co",

"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4ZXpuZnhjbHRqb3Btc2twbnF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzNzAyNDksImV4cCI6MjA5MDk0NjI0OX0.RdBfTCcJnK2xP3WVc99QXnLHfhyuNlG2rsTPWsBp5F4"

);

let username="";
let lastMessageId=0;

function connect(){

username=document.getElementById("username").value;

if(username.length<2){

alert("enter username");

return;

}

document.getElementById("login").style.display="none";

document.getElementById("chat").style.display="block";

loadMessages();

setInterval(loadMessages,3000);

}

function corrupt(text){

let chars=text.split("");

for(let i=0;i<chars.length;i++){

if(Math.random()<0.1){

chars[i]="#@$%&█".charAt(

Math.floor(Math.random()*6)

);

}

}

return chars.join("");

}

function display(msg){

let div=document.createElement("div");

div.innerHTML="<b>"+msg.username+"</b>: "+msg.message;

document.getElementById("messages").appendChild(div);

}

async function sendMsg(){

let text=document.getElementById("msg").value;

document.getElementById("msg").value="";

let delay=5000+Math.random()*5000;

let div=document.createElement("div");

div.innerHTML="<i>sending...</i>";

document.getElementById("messages").appendChild(div);

setTimeout(async()=>{

await supabase

.from("messages")

.insert({

username:username,

message:corrupt(text)

});

div.remove();

},delay);

}

async function loadMessages(){

let {data}=await supabase

.from("messages")

.select("*")

.gt("id",lastMessageId)

.order("id");

data.forEach(m=>{

display(m);

lastMessageId=m.id;

});

}

</script>

</body>

</html>
