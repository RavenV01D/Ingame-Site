<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Island Network Chat</title>

<style>

body{
background:black;
color:#d0d0d0;
font-family:monospace;
margin:0;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
color:white;
text-shadow: 2px 2px red, -2px -2px blue;
}

#loginBox{
text-align:center;
margin-top:120px;
}

input{
background:#111;
border:1px solid #333;
color:white;
padding:10px;
font-family:monospace;
}

button{
background:#111;
border:1px solid #333;
color:white;
padding:10px 20px;
margin-top:10px;
cursor:pointer;
}

button:hover{
border-color:white;
}

#chatBox{
display:none;
}

#messages{
height:400px;
overflow-y:auto;
border:1px solid #222;
padding:10px;
background:#050505;
margin-bottom:10px;
}

.msg{
margin-bottom:8px;
}

.system{
color:#888;
font-style:italic;
}

.warning{
color:#ff5555;
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="container">

<h1>ISLAND NETWORK</h1>

<div id="loginBox">
<p>Enter username to connect</p>
<input id="username" placeholder="username">
<br>
<button onclick="login()">connect</button>
</div>

<div id="chatBox">

<div class="warning">
Due to limited bandwidth on the island, messages may be delayed or corrupted.
</div>

<div id="messages"></div>

<input id="msgInput" placeholder="type message..." style="width:80%;">
<button onclick="sendMessage()">send</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// free realtime backend
const supabase = window.supabase.createClient(
"https://demo.supabase.co",
"public-anon-key"
);

// NOTE:
// replace above with your own supabase later if needed
// for testing we simulate local chat

let username = "";
let messages = [];

function login(){

username = document.getElementById("username").value.trim();

if(username.length < 2){
alert("invalid username");
return;
}

document.getElementById("loginBox").style.display="none";
document.getElementById("chatBox").style.display="block";

addSystem("connected to island relay");
simulateOthers();

}

function addSystem(text){

let msgBox=document.getElementById("messages");

msgBox.innerHTML+=`
<div class="msg system">
${text}
</div>
`;

msgBox.scrollTop=msgBox.scrollHeight;

}

function corrupt(text){

let chars=text.split("");

for(let i=0;i<chars.length;i++){

if(Math.random()<0.1){

chars[i]=randomChar();

}

}

return chars.join("");

}

function randomChar(){

const set="#$%&@?█▒░ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

return set[Math.floor(Math.random()*set.length)];

}

function sendMessage(){

let input=document.getElementById("msgInput");
let text=input.value.trim();

if(text=="") return;

input.value="";

addSystem("transmitting... signal unstable");

let delay=5000+Math.random()*5000;

setTimeout(()=>{

let corrupted=corrupt(text);

displayMessage(username, corrupted);

}, delay);

}

function displayMessage(user,text){

let msgBox=document.getElementById("messages");

msgBox.innerHTML+=`
<div class="msg">
<b>${user}:</b> ${text}
</div>
`;

msgBox.scrollTop=msgBox.scrollHeight;

}

// fake other players for immersion

function simulateOthers(){

let names=["unit-03","relay-tech","unknown","survivor"];

setInterval(()=>{

let randomMsg=[
"signal weak near forest",
"anyone alive?",
"something moved outside",
"stay inside at night",
"radio interference detected"
];

let msg=randomMsg[Math.floor(Math.random()*randomMsg.length)];

displayMessage(
names[Math.floor(Math.random()*names.length)],
corrupt(msg)
);

}, 15000);

}

</script>

</body>
</html>
